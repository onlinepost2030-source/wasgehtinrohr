<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>15 Minuten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #EFEAD9;
    --surface: #F8F4E8;
    --ink: #23291F;
    --muted: #6B7261;
    --accent: #C98A3B;
    --accent-soft: #E7C596;
    --ring-track: #D9D1B9;
    --danger: #B5573A;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171C16;
      --surface: #1E241C;
      --ink: #EDE8D8;
      --muted: #93998A;
      --accent: #E0A857;
      --accent-soft: #4C3C1F;
      --ring-track: #333B30;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171C16;
    --surface: #1E241C;
    --ink: #EDE8D8;
    --muted: #93998A;
    --accent: #E0A857;
    --accent-soft: #4C3C1F;
    --ring-track: #333B30;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: 100%;
    max-width: 420px;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 24px calc(32px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 22px;
  }

  .pill {
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--ring-track);
    border-radius: 999px;
    padding: 7px 16px;
  }
  .pill strong { color: var(--ink); font-weight: 600; }

  .stage {
    position: relative;
    width: min(66vw, 250px);
    height: min(66vw, 250px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ring-track { fill: none; stroke: var(--ring-track); stroke-width: 5; }
  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 5;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.6s ease;
  }

  .icon-btn {
    position: relative;
    width: 72%;
    height: 72%;
    border-radius: 50%;
    border: none;
    background: var(--surface);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .icon-btn .mark {
    width: 40%;
    height: 40%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn svg.leaf { width: 100%; height: 100%; color: var(--muted); transition: color 0.3s ease; }
  .icon-btn .label {
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  @media (prefers-reduced-motion: no-preference) {
    .stage.pending .icon-btn { animation: breathe 4.5s ease-in-out infinite; }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }
  .stage.done .icon-btn svg.leaf { color: var(--accent); }
  .stage.done .icon-btn .label { color: var(--accent); }
  .stage.just-done .icon-btn { animation: pop 0.5s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    35% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  h1 {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
  }
  .quote {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
    max-width: 30ch;
    margin: 0;
  }

  .week {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .day span.d {
    font-size: 11px;
    color: var(--muted);
  }
  .day .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--ring-track);
    background: transparent;
  }
  .day.filled .dot { background: var(--accent); border-color: var(--accent); }
  .day.today .dot { box-shadow: 0 0 0 3px var(--accent-soft); }

  .timer-toggle {
    border: none;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 6px;
  }

  .timer {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--ring-track);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .timer .clock {
    font-family: "Fraunces", serif;
    font-size: 40px;
    font-variant-numeric: tabular-nums;
  }
  .timer-row { display: flex; gap: 10px; }
  .btn {
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--bg); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--ring-track); }

  .undo {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="app">
  <div class="pill" id="streakPill"><strong>0</strong> Tage in Folge</div>

  <div class="stage pending" id="stage">
    <svg viewBox="0 0 100 100">
      <circle class="ring-track" cx="50" cy="50" r="45"></circle>
      <circle class="ring-progress" id="ringProgress" cx="50" cy="50" r="45"
        stroke-dasharray="282.7" stroke-dashoffset="282.7"></circle>
    </svg>
    <button class="icon-btn" id="mainBtn" aria-pressed="false">
      <span class="mark">
        <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 21c-4.5-1-8-4.8-8-10.2C4 6.6 7.5 3.5 12 3c4.5.5 8 3.6 8 7.8C20 16.2 16.5 20 12 21z"/>
          <path d="M12 21c0-6 0-12 5-16"/>
        </svg>
      </span>
      <span class="label" id="btnLabel">Heute noch offen</span>
    </button>
  </div>

  <p class="quote" id="quote"></p>

  <div class="week" id="week"></div>

  <button class="timer-toggle" id="timerToggle">15-Minuten-Timer starten</button>

  <div class="timer" id="timerBox" hidden>
    <div class="clock" id="clock">15:00</div>
    <div class="timer-row">
      <button class="btn primary" id="timerStart">Start</button>
      <button class="btn ghost" id="timerReset">Zurücksetzen</button>
    </div>
  </div>

  <button class="undo" id="undoBtn" hidden>heute rückgängig machen</button>
</div>

<script>
(function () {
  const STORAGE_KEY = "yoga-daily-v1";
  const quotes = [
    "Fünfzehn Minuten für den Körper, der dich überallhin trägt.",
    "Du musst nicht perfekt sein – nur auf der Matte.",
    "Ein ruhiger Atemzug genügt, um anzufangen.",
    "Kleine Bewegung heute, spürbarer Unterschied morgen.",
    "Die Matte wartet nicht auf Motivation, nur auf dich.",
    "Beweglichkeit ist ein Geschenk, das du dir selbst machst.",
    "Nicht jede Übung muss gelingen – jede zählt trotzdem.",
    "Fünfzehn Minuten sind kürzer als die Ausrede dagegen.",
    "Dein Körper merkt sich jeden Tag, an dem du da warst.",
    "Ruhe ist auch eine Form von Fortschritt."
  ];

  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function localLoad() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { done: {} };
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === "object" ? { done: parsed.done || {} } : { done: {} };
    } catch (e) {
      return { done: {} };
    }
  }

  function localSave(s) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
  }

  let state = { done: {} };
  let dbRef = null;

  function persist() {
    localSave(state);
    if (dbRef) {
      dbRef.set(state).catch(function () {});
    }
  }

  function dayOfYear(d) {
    const start = new Date(d.getFullYear(), 0, 0);
    return Math.floor((d - start) / 86400000);
  }

  function computeStreak() {
    let streak = 0;
    let cursor = new Date();
    if (!state.done[todayKey(cursor)]) {
      cursor.setDate(cursor.getDate() - 1);
    }
    while (state.done[todayKey(cursor)]) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  const stage = document.getElementById("stage");
  const mainBtn = document.getElementById("mainBtn");
  const btnLabel = document.getElementById("btnLabel");
  const ringProgress = document.getElementById("ringProgress");
  const streakPill = document.getElementById("streakPill");
  const weekEl = document.getElementById("week");
  const undoBtn = document.getElementById("undoBtn");
  const quoteEl = document.getElementById("quote");

  quoteEl.textContent = "„" + quotes[dayOfYear(new Date()) % quotes.length] + "“";

  function render() {
    const key = todayKey();
    const isDone = !!state.done[key];
    stage.classList.toggle("done", isDone);
    stage.classList.toggle("pending", !isDone);
    mainBtn.setAttribute("aria-pressed", String(isDone));
    btnLabel.textContent = isDone ? "Heute erledigt" : "Heute noch offen";
    ringProgress.style.strokeDashoffset = isDone ? "0" : "282.7";
    undoBtn.hidden = !isDone;

    const streak = computeStreak();
    streakPill.innerHTML = "<strong>" + streak + "</strong> Tag" + (streak === 1 ? "" : "e") + " in Folge";

    const dayNames = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
    weekEl.innerHTML = "";
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const k = todayKey(d);
      const wrap = document.createElement("div");
      wrap.className = "day" + (state.done[k] ? " filled" : "") + (i === 0 ? " today" : "");
      wrap.innerHTML = '<span class="d">' + dayNames[d.getDay()] + '</span><span class="dot"></span>';
      weekEl.appendChild(wrap);
    }
  }

  function markDone(withPop) {
    state.done[todayKey()] = true;
    persist();
    render();
    if (withPop) {
      stage.classList.add("just-done");
      setTimeout(() => stage.classList.remove("just-done"), 500);
    }
  }

  mainBtn.addEventListener("click", function () {
    const key = todayKey();
    if (state.done[key]) return;
    markDone(true);
  });

  undoBtn.addEventListener("click", function () {
    delete state.done[todayKey()];
    persist();
    render();
  });

  async function init() {
    state = localLoad();
    render();
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db && user) {
          const id = await user.id();
          if (id) {
            dbRef = db.doc("data/users/" + id + "/tracker");
            const snap = await dbRef.get();
            if (snap.exists && snap.data() && snap.data().done) {
              state = { done: snap.data().done };
            } else {
              await dbRef.set(state);
            }
            render();
          }
        }
      }
    } catch (e) {
      // Kein Zugriff auf den Server-Speicher möglich – lokaler Stand bleibt gültig.
    }
  }

  init();

  // Timer
  const timerToggle = document.getElementById("timerToggle");
  const timerBox = document.getElementById("timerBox");
  const clockEl = document.getElementById("clock");
  const timerStart = document.getElementById("timerStart");
  const timerReset = document.getElementById("timerReset");

  let seconds = 15 * 60;
  let intervalId = null;

  function formatClock(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }

  function tick() {
    seconds--;
    clockEl.textContent = formatClock(seconds);
    if (seconds <= 0) {
      clearInterval(intervalId);
      intervalId = null;
      timerStart.textContent = "Start";
      markDone(true);
    }
  }

  timerToggle.addEventListener("click", function () {
    const open = timerBox.hidden;
    timerBox.hidden = !open;
    timerToggle.textContent = open ? "Timer ausblenden" : "15-Minuten-Timer starten";
  });

  timerStart.addEventListener("click", function () {
    if (intervalId) {
      clearInterval(intervalId);
      intervalId = null;
      timerStart.textContent = "Weiter";
    } else {
      if (seconds <= 0) seconds = 15 * 60;
      intervalId = setInterval(tick, 1000);
      timerStart.textContent = "Pause";
    }
  });

  timerReset.addEventListener("click", function () {
    clearInterval(intervalId);
    intervalId = null;
    seconds = 15 * 60;
    clockEl.textContent = formatClock(seconds);
    timerStart.textContent = "Start";
  });
})();
</script>
</body>
</html>
